<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#0F0E17;color:#fff;min-height:100vh}#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0F0E17}#login.h{display:none}.card{width:100%;max-width:380px;background:#1A1827;border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px}.card h1{font-size:24px;font-weight:700;text-align:center}.card input{width:100%;padding:12px 14px;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;font-size:15px;background:rgba(255,255,255,.06);color:#fff;outline:none;font-family:inherit}.card input:focus{border-color:#6C3AED}#lerr{font-size:13px;color:#F87171;text-align:center;min-height:20px}#lbtn{padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#6C3AED,#9333EA);color:#fff;font-family:inherit}#lbtn:disabled{opacity:.5}#app{display:none}.bar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.08);background:#1A1827;position:sticky;top:0}.bar h1{font-size:16px;font-weight:700;flex:1}.btn{font-size:13px;color:#A7A9BE;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:24px}.stat{background:#1A1827;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;text-align:center}.sn{font-size:32px;font-weight:700}.sl{font-size:12px;color:#6B6D7C;margin-top:6px}.sec{padding:0 24px 28px}.sec h2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}.sec h2 span{font-size:12px;color:#6B6D7C;font-weight:400}.rf{margin-left:auto;font-size:12px;color:#A78BFA;background:none;border:none;cursor:pointer;font-family:inherit}table{width:100%;border-collapse:collapse;background:#1A1827;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}th{padding:11px 16px;font-size:11px;font-weight:600;color:#6B6D7C;text-align:left;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.08)}td{padding:11px 16px;font-size:13px;color:#A7A9BE;border-bottom:1px solid rgba(255,255,255,.06)}tr:last-child td{border-bottom:none}tr:hover td{background:rgba(255,255,255,.02)}.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(108,58,237,.25);color:#A78BFA}.del{padding:5px 12px;border-radius:8px;font-size:12px;border:1px solid rgba(248,113,113,.3);color:#F87171;background:rgba(248,113,113,.08);cursor:pointer;font-family:inherit}.pill{padding:3px 10px;border-radius:20px;font-size:11px;background:rgba(108,58,237,.15);color:#A78BFA}.ld{text-align:center;padding:40px;color:#6B6D7C;font-size:14px}.mc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="login"><div class="card"><h1>Admin Panel</h1><p style="font-size:14px;color:#A7A9BE;text-align:center">Sign in with admin account</p><input id="lu" type="text" placeholder="Username" autocomplete="username"/><input id="lp" type="password" placeholder="Password"/><div id="lerr"></div><button id="lbtn">Sign in</button></div></div>
<div id="app"><div class="bar"><h1>Admin Panel</h1><span id="aw" style="font-size:13px;color:#A7A9BE"></span><a href="/" class="btn">Chat</a><button class="btn" onclick="so()">Sign out</button></div>
<div class="stats"><div class="stat"><div class="sn" id="su">-</div><div class="sl">Users</div></div><div class="stat"><div class="sn" id="sm">-</div><div class="sl">Messages</div></div><div class="stat"><div class="sn" id="sr">-</div><div class="sl">Rooms</div></div><div class="stat"><div class="sn" id="so2" style="color:#4ADE80">-</div><div class="sl">Online now</div></div></div>
<div class="sec"><h2>Who is online <span id="oc"></span><button class="rf" onclick="lo()">Refresh</button></h2><div id="ot"><div class="ld">Loading...</div></div></div>
<div class="sec"><h2>Users <span id="uc"></span><button class="rf" onclick="lu2()">Refresh</button></h2><div id="ut"><div class="ld">Loading...</div></div></div>
<div class="sec"><h2>Messages <span id="mc"></span><button class="rf" onclick="lm()">Refresh</button></h2><div id="mt"><div class="ld">Loading...</div></div></div>
</div>
<script>
const B='https://chatapp-production-501c.up.railway.app';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tok=()=>localStorage.getItem('tcr_token');
const af=(url,o={})=>{const t=tok();const sep=url.includes('?')?'&':'?';const u=t?url+sep+'token='+encodeURIComponent(t):url;const h={...(o.headers||{}),...(t?{'x-auth-token':t}:{})};if(o.body)h['Content-Type']='application/json';return fetch(u,{...o,headers:h});};
document.getElementById('lu').onkeydown=e=>{if(e.key==='Enter')document.getElementById('lp').focus();};
document.getElementById('lp').onkeydown=e=>{if(e.key==='Enter')li();};
document.getElementById('lbtn').onclick=li;
async function li(){const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value,err=document.getElementById('lerr'),btn=document.getElementById('lbtn');if(!u||!p){err.textContent='Fill both fields';return;}btn.disabled=true;err.textContent='Signing in...';try{const r=await fetch(B+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok){err.textContent=d.error;return;}if(d.token)localStorage.setItem('tcr_token',d.token);const ar=await af(B+'/api/admin/stats');if(ar.status===403){err.textContent='Not an admin';return;}if(!ar.ok){err.textContent='Cannot access admin';return;}show(u);}catch(e){err.textContent='Cannot reach server';}finally{btn.disabled=false;}}
function show(u){document.getElementById('aw').textContent=u;document.getElementById('login').classList.add('h');document.getElementById('app').style.display='block';la();setInterval(lo,10000);}
function so(){localStorage.removeItem('tcr_token');location.reload();}
function la(){ls();lo();lu2();lm();}
async function ls(){try{const[sr,rr,cr]=await Promise.all([af(B+'/api/admin/stats'),af(B+'/api/rooms'),af(B+'/api/admin/connected')]);if(sr.ok){const d=await sr.json();document.getElementById('su').textContent=d.users;document.getElementById('sm').textContent=d.messages;document.getElementById('sr').textContent=d.rooms;}if(cr.ok){const c=await cr.json();document.getElementById('so2').textContent=c.count;document.getElementById('oc').textContent=c.count+' online';}}catch(e){}}
async function lo(){const el=document.getElementById('ot');el.innerHTML='<div class="ld">Loading...</div>';try{const r=await af(B+'/api/rooms');const rooms=await r.json();const active=rooms.filter(r=>r.online>0);const total=rooms.reduce((s,r)=>s+(r.online||0),0);document.getElementById('oc').textContent=total+' online';if(!active.length){el.innerHTML='<div class="ld">No one online right now</div>';return;}let h='<table><tr><th>Room</th><th>Users online</th></tr>';active.forEach(r=>{h+='<tr><td>'+esc(r.icon||'')+' '+esc(r.name)+'</td><td style="color:#4ADE80;font-weight:600">'+r.online+'</td></tr>';});el.innerHTML=h+'</table>';}catch(e){el.innerHTML='<div class="ld">Failed</div>';}}
async function lu2(){const el=document.getElementById('ut');el.innerHTML='<div class="ld">Loading...</div>';try{const r=await af(B+'/api/admin/users');const users=await r.json();document.getElementById('uc').textContent=users.length+' total';if(!users.length){el.innerHTML='<div class="ld">No users</div>';return;}const t=document.createElement('table');t.innerHTML='<tr><th>Username</th><th>Role</th><th>Messages</th><th>Joined</th><th>Action</th></tr>';users.forEach(u=>{const tr=document.createElement('tr');tr.innerHTML='<td style="color:#fff;font-weight:500">'+esc(u.username)+'</td><td>'+(u.is_admin?'<span class="badge">Admin</span>':'User')+'</td><td style="color:#A78BFA">'+u.msg_count+'</td><td>'+new Date(u.created_at).toLocaleDateString()+'</td><td>'+(u.is_admin?'':'<button class="del" data-id="'+u.id+'" data-n="'+esc(u.username)+'">Delete</button>')+'</td>';t.appendChild(tr);});el.innerHTML='';el.appendChild(t);el.querySelectorAll('.del[data-id]').forEach(b=>b.onclick=()=>du(b.dataset.id,b.dataset.n));}catch(e){el.innerHTML='<div class="ld">Failed</div>';}}
async function lm(){const el=document.getElementById('mt');el.innerHTML='<div class="ld">Loading...</div>';try{const r=await af(B+'/api/admin/messages');const msgs=await r.json();document.getElementById('mc').textContent=msgs.length+' recent';if(!msgs.length){el.innerHTML='<div class="ld">No messages</div>';return;}const t=document.createElement('table');t.innerHTML='<tr><th>User</th><th>Room</th><th>Message</th><th>Time</th><th></th></tr>';msgs.forEach(m=>{const tr=document.createElement('tr');tr.innerHTML='<td style="color:#fff;font-weight:500">'+esc(m.sender_name)+'</td><td><span class="pill">'+esc(m.room_id)+'</span></td><td class="mc" title="'+esc(m.content)+'">'+esc(m.content)+'</td><td style="font-size:11px;white-space:nowrap">'+new Date(m.created_at).toLocaleString()+'</td><td><button class="del" data-id="'+m.id+'">Del</button></td>';t.appendChild(tr);});el.innerHTML='';el.appendChild(t);el.querySelectorAll('.del[data-id]').forEach(b=>b.onclick=()=>dm(b.dataset.id));}catch(e){el.innerHTML='<div class="ld">Failed</div>';}}
async function du(id,n){if(!confirm('Delete "'+n+'"?'))return;const r=await af(B+'/api/admin/users/'+id,{method:'DELETE'});if(r.ok){lu2();ls();}}
async function dm(id){console.log('deleting id:',id);if(!confirm('Delete?'))return;const r=await af(B+'/api/admin/messages/'+id,{method:'DELETE'});const d=await r.json();console.log('delete result:',r.status,d);if(r.ok){lm();ls();}else{alert('Error: '+JSON.stringify(d));}}
setInterval(ls,30000);setInterval(lo,15000);
const t=tok();if(t){af(B+'/api/auth/me').then(r=>r.ok?r.json():null).then(async u=>{if(!u)return;const ar=await af(B+'/api/admin/stats');if(ar.ok)show(u.username);}).catch(()=>{});}
</script></body></html>
