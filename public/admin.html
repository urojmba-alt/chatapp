<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0F0E17;color:#fff;min-height:100vh}#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0F0E17}#login.h{display:none}.card{width:100%;max-width:340px;background:#1A1827;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px}.card h1{font-size:20px;font-weight:700;text-align:center}.card input{width:100%;padding:11px 14px;border:1px solid rgba(255,255,255,.12);border-radius:10px;font-size:14px;background:rgba(255,255,255,.06);color:#fff;outline:none;font-family:inherit}#lerr{font-size:12px;color:#F87171;text-align:center;min-height:18px}#lbtn{padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#6C3AED,#9333EA);color:#fff;font-family:inherit}#app{display:none}.bar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:#1A1827;position:sticky;top:0}.bar h1{font-size:15px;font-weight:700;flex:1}.btn{font-size:13px;color:#A7A9BE;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}.stat{background:#1A1827;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;text-align:center}.sn{font-size:28px;font-weight:700}.sl{font-size:12px;color:#6B6D7C;margin-top:4px}.sec{padding:0 20px 24px}.sec h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}.sec h2 span{font-size:12px;color:#6B6D7C;font-weight:400}.rf{margin-left:auto;font-size:12px;color:#A78BFA;background:none;border:none;cursor:pointer;font-family:inherit}table{width:100%;border-collapse:collapse;background:#1A1827;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}th{padding:10px 14px;font-size:11px;font-weight:600;color:#6B6D7C;text-align:left;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.08)}td{padding:10px 14px;font-size:13px;color:#A7A9BE;border-bottom:1px solid rgba(255,255,255,.08)}tr:last-child td{border-bottom:none}.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(108,58,237,.3);color:#A78BFA}.del{padding:4px 10px;border-radius:8px;font-size:12px;border:1px solid rgba(248,113,113,.3);color:#F87171;background:rgba(248,113,113,.1);cursor:pointer;font-family:inherit}.pill{padding:2px 8px;border-radius:8px;font-size:11px;background:rgba(108,58,237,.2);color:#A78BFA}.ld{text-align:center;padding:30px;color:#6B6D7C;font-size:14px}.mc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="login"><div class="card"><h1>⚡ Admin Panel</h1><p style="font-size:13px;color:#A7A9BE;text-align:center">Sign in with admin account</p><input id="lu" type="text" placeholder="Username"/><input id="lp" type="password" placeholder="Password"/><div id="lerr"></div><button id="lbtn">Sign in</button></div></div>
<div id="app"><div class="bar"><h1>⚡ Admin</h1><span id="aw" style="font-size:13px;color:#A7A9BE"></span><a href="/" class="btn">← Chat</a><button class="btn" onclick="so()">Sign out</button></div><div class="stats"><div class="stat"><div class="sn" id="su">—</div><div class="sl">Users</div></div><div class="stat"><div class="sn" id="sm">—</div><div class="sl">Messages</div></div><div class="stat"><div class="sn" id="sr">—</div><div class="sl">Rooms</div></div><div class="stat"><div class="sn" id="so2" style="color:#4ADE80">—</div><div class="sl">Online</div></div></div><div class="sec"><h2>Users <span id="uc"></span><button class="rf" onclick="lu()">↻</button></h2><div id="ut"><div class="ld">Loading...</div></div></div><div class="sec"><h2>Messages <span id="mc"></span><button class="rf" onclick="lm()">↻</button></h2><div id="mt"><div class="ld">Loading...</div></div></div></div>
<script>
const B='https://chatapp-production-501c.up.railway.app';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tok=()=>localStorage.getItem('tcr_token');
const af=(url,o={})=>{const t=tok();const h={...(o.headers||{}),...(t?{'x-auth-token':t}:{})};if(o.body)h['Content-Type']='application/json';return fetch(url,{...o,credentials:'include',headers:h});};
document.getElementById('lu').onkeydown=e=>{if(e.key==='Enter')document.getElementById('lp').focus();};
document.getElementById('lp').onkeydown=e=>{if(e.key==='Enter')li();};
document.getElementById('lbtn').onclick=li;
async function li(){const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value,err=document.getElementById('lerr'),btn=document.getElementById('lbtn');if(!u||!p){err.textContent='Fill both fields';return;}btn.disabled=true;err.textContent='Signing in...';try{const r=await fetch(B+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok){err.textContent=d.error;return;}if(d.token)localStorage.setItem('tcr_token',d.token);const ar=await af(B+'/api/admin/stats');if(ar.status===403){err.textContent='Not an admin';return;}if(!ar.ok){err.textContent='Cannot access admin';return;}show(u);}catch(e){err.textContent='Cannot reach server';}finally{btn.disabled=false;}}
function show(u){document.getElementById('aw').textContent=u;document.getElementById('login').classList.add('h');document.getElementById('app').style.display='block';la();}
function so(){localStorage.removeItem('tcr_token');location.reload();}
function la(){ls();lu();lm();}
async function ls(){try{const[sr,rr]=await Promise.all([af(B+'/api/admin/stats'),af(B+'/api/rooms')]);if(sr.ok){const d=await sr.json();document.getElementById('su').textContent=d.users;document.getElementById('sm').textContent=d.messages;document.getElementById('sr').textContent=d.rooms;}if(rr.ok){const rooms=await rr.json();document.getElementById('so2').textContent=rooms.reduce((s,r)=>s+(r.online||0),0);}}catch(e){}}
async function lu(){const el=document.getElementById('ut');el.innerHTML='<div class="ld">Loading...</div>';try{const r=await af(B+'/api/admin/users');const users=await r.json();document.getElementById('uc').textContent=users.length+' total';if(!users.length){el.innerHTML='<div class="ld">No users</div>';return;}const t=document.createElement('table');t.innerHTML='<tr><th>Username</th><th>Role</th><th>Joined</th><th></th></tr>';users.forEach(u=>{const tr=document.createElement('tr');tr.innerHTML='<td style="color:#fff;font-weight:500">'+esc(u.username)+'</td><td>'+(u.is_admin?'<span class="badge">Admin</span>':'User')+'</td><td>'+new Date(u.created_at).toLocaleDateString()+'</td><td>'+(u.is_admin?'':'<button class="del" data-id="'+u.id+'" data-n="'+esc(u.username)+'">Delete</button>')+'</td>';t.appendChild(tr);});el.innerHTML='';el.appendChild(t);el.querySelectorAll('.del[data-id]').forEach(b=>b.onclick=()=>du(b.dataset.id,b.dataset.n));}catch(e){el.innerHTML='<div class="ld">Failed</div>';}}
async function lm(){const el=document.getElementById('mt');el.innerHTML='<div class="ld">Loading...</div>';try{const r=await af(B+'/api/admin/messages');const msgs=await r.json();document.getElementById('mc').textContent=msgs.length+' recent';if(!msgs.length){el.innerHTML='<div class="ld">No messages</div>';return;}const t=document.createElement('table');t.innerHTML='<tr><th>User</th><th>Room</th><th>Message</th><th>Time</th><th></th></tr>';msgs.forEach(m=>{const tr=document.createElement('tr');tr.innerHTML='<td style="color:#fff;font-weight:500">'+esc(m.sender_name)+'</td><td><span class="pill">'+esc(m.room_id)+'</span></td><td class="mc" title="'+esc(m.content)+'">'+esc(m.content)+'</td><td style="font-size:11px;white-space:nowrap">'+new Date(m.created_at).toLocaleString()+'</td><td><button class="del" data-id="'+m.id+'">Del</button></td>';t.appendChild(tr);});el.innerHTML='';el.appendChild(t);el.querySelectorAll('.del[data-id]').forEach(b=>b.onclick=()=>dm(b.dataset.id));}catch(e){el.innerHTML='<div class="ld">Failed</div>';}}
async function du(id,n){if(!confirm('Delete "'+n+'"?'))return;const r=await af(B+'/api/admin/users/'+id,{method:'DELETE'});if(r.ok){lu();ls();}}
async function dm(id){if(!confirm('Delete?'))return;const r=await af(B+'/api/admin/messages/'+id,{method:'DELETE'});if(r.ok){lm();ls();}}
setInterval(ls,30000);
const t=tok();if(t){af(B+'/api/auth/me').then(r=>r.ok?r.json():null).then(async u=>{if(!u)return;const ar=await af(B+'/api/admin/stats');if(ar.ok)show(u.username);}).catch(()=>{});}
</script></body></html>
